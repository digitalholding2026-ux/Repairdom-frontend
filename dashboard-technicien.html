<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairDom - Tableau de bord technicien</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .page { padding: 40px 0 80px; }
        .page-inner { max-width: 820px; margin: 0 auto; }
        .page-title { font-size: 1.5rem; color: var(--gray-900); margin-bottom: 24px; }

        /* Profil */
        .profile-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tech-avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: var(--blue-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--blue);
            flex-shrink: 0;
        }
        .profile-info { flex: 1; min-width: 200px; }
        .profile-name { font-size: 1.15rem; font-weight: 700; color: var(--gray-900); }
        .profile-sub { font-size: 0.85rem; color: var(--gray-500); margin-top: 4px; }
        .profile-sub i { margin-right: 6px; }
        .stars { color: #F59F00; font-size: 0.9rem; letter-spacing: 1px; }
        .stars-count { font-size: 0.78rem; color: var(--gray-500); margin-left: 4px; }

        /* Disponibilité */
        .avail-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .badge-avail {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .badge-avail.on { background: #D3F9D8; color: #2B8A3E; }
        .badge-avail.off { background: #FFE3E3; color: #C92A2A; }
        .btn-toggle {
            padding: 9px 20px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--blue);
            background: var(--white);
            color: var(--blue);
            transition: background var(--transition), color var(--transition);
        }
        .btn-toggle:hover { background: var(--blue); color: var(--white); }

        /* Missions */
        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .mission-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .mission-main { flex: 1; min-width: 220px; }
        .mission-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .mission-client { font-weight: 700; color: var(--gray-900); }
        .mission-meta { font-size: 0.85rem; color: var(--gray-500); margin-top: 4px; }
        .mission-meta i { margin-right: 6px; }
        .mission-issue { font-size: 0.9rem; color: var(--gray-800); margin-top: 8px; }

        .badge-statut {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            background: var(--gray-100);
            color: var(--gray-500);
        }
        .badge-statut.pending { background: #FFF3BF; color: #E67700; }
        .badge-statut.accepted { background: #D3F9D8; color: #2B8A3E; }
        .badge-statut.in-progress { background: var(--blue-pale); color: var(--blue); }
        .badge-statut.completed { background: #D3F9D8; color: #2B8A3E; }
        .badge-statut.cancelled { background: #FFE3E3; color: #C92A2A; }

        .mission-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-chat {
            padding: 10px 18px;
            background: var(--blue);
            color: var(--white);
            border: none;
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background var(--transition);
        }
        .btn-chat:hover { background: var(--blue-light); }
        .btn-ghost {
            padding: 10px 18px;
            background: var(--white);
            color: var(--blue);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background var(--transition);
        }
        .btn-ghost:hover { background: var(--blue-pale); }

        .empty-msg {
            text-align: center;
            color: var(--gray-500);
            padding: 40px 0;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-size: 0.95rem;
        }

        /* Sélecteur (aucun id fourni) */
        .picker-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 24px;
            margin-bottom: 24px;
        }
        .picker-card h3 { font-size: 1rem; color: var(--gray-900); margin-bottom: 6px; }
        .picker-card p { font-size: 0.88rem; color: var(--gray-500); margin-bottom: 18px; }
        .picker-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .picker-row select {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            font-size: 0.9rem;
            background: var(--gray-50);
        }
        .picker-row select:focus { outline: none; border-color: var(--blue); }

        @media (max-width: 600px) {
            .avail-col { align-items: stretch; width: 100%; }
            .btn-toggle { width: 100%; }
            .mission-actions { width: 100%; }
            .mission-actions a { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>
    <script>
        // Page protégée : redirige vers la connexion si non authentifié.
        if (localStorage.getItem('token') === null) {
            window.location.href = 'login.html';
        }
    </script>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon"><i class="fa-solid fa-screwdriver-wrench"></i></span>
                <span class="logo-text">RepairDom</span>
            </a>
            <button class="menu-toggle" aria-label="Menu">&#9776;</button>
            <nav class="nav" id="mainNav"></nav>
        </div>
    </header>

    <main class="page">
        <div class="container page-inner">
            <nav class="breadcrumb">
                <a href="index.html">Accueil</a>
                <span class="separator"><i class="fa-solid fa-chevron-right"></i></span>
                <span class="current">Espace technicien</span>
            </nav>
            <h1 class="page-title">Tableau de bord technicien</h1>

            <div id="pickerCard"></div>
            <div id="techPanel" style="display:none;">

                <div class="profile-card">
                    <div class="tech-avatar" id="techAvatar">??</div>
                    <div class="profile-info">
                        <div class="profile-name" id="techName">—</div>
                        <div class="profile-sub"><i class="fa-solid fa-screwdriver-wrench"></i><span id="techSpecialty">—</span></div>
                        <div class="profile-sub"><i class="fa-solid fa-location-dot"></i><span id="techLocation">—</span></div>
                        <div class="stars" id="techRating"></div>
                    </div>
                    <div class="avail-col">
                        <span class="badge-avail" id="techAvailBadge">—</span>
                        <button class="btn-toggle" id="toggleAvailBtn"><i class="fa-solid fa-circle-dot"></i> Changer mon statut</button>
                    </div>
                </div>

                <div class="section-title"><i class="fa-solid fa-clipboard-list" style="color:var(--blue);"></i> Mes missions</div>
                <div id="missionList">
                    <div class="loading-overlay"><span class="spinner dark"></span> Chargement des missions...</div>
                </div>

            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <p>&copy; 2026 RepairDom. Tous droits réservés.</p>
        </div>
    </footer>
    <div class="toast-container" id="toastContainer"></div>

    <script src="./app.js"></script>
    <script src="./auth.js"></script>
    <script src="./nav.js"></script>
    <script>
        /* --- Toast --- */
        function showToast(msg, type) {
            var c = document.getElementById('toastContainer');
            var t = document.createElement('div');
            t.className = 'toast ' + (type || 'info');
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(function () { t.classList.add('removing'); }, 4000);
            setTimeout(function () { t.remove(); }, 4400);
        }

        /* --- Technicien connecté --- */
        const params = new URLSearchParams(window.location.search);
        let techId = params.get('id') || params.get('tech') || localStorage.getItem('techId') || '';

        const statusLabels = {
            pending: 'En attente',
            accepted: 'Acceptée',
            'in-progress': 'En cours',
            completed: 'Terminée',
            cancelled: 'Annulée'
        };
        const ACTIVE = ['pending', 'accepted', 'in-progress'];

        let tech = null;

        async function api(url, opts) {
            const res = await fetch(API_URL + url, opts || {});
            if (!res.ok) throw new Error((await res.json())?.error || 'Erreur serveur');
            return res.json();
        }

        /* --- Si aucun id : proposer le choix du technicien (demo) --- */
        async function renderPicker() {
            const pickerCard = document.getElementById('pickerCard');
            if (techId) { pickerCard.innerHTML = ''; return; }
            let techs = [];
            try { techs = await api('/api/technicians'); } catch {}
            if (!techs.length) { pickerCard.style.display = 'none'; return; }
            pickerCard.innerHTML = `
                <div class="picker-card">
                    <h3><i class="fa-solid fa-user-gear"></i> Quel technicien êtes-vous ?</h3>
                    <p>Connectez votre profil (démo) pour afficher votre tableau de bord.</p>
                    <div class="picker-row">
                        <select id="pickerSelect">
                            ${techs.map(t => `<option value="${t.id}">${t.name} — ${t.specialty}</option>`).join('')}
                        </select>
                        <button class="btn btn-primary" id="pickerBtn">Ouvrir mon espace</button>
                    </div>
                </div>`;
            document.getElementById('pickerBtn').addEventListener('click', () => {
                techId = document.getElementById('pickerSelect').value;
                localStorage.setItem('techId', techId);
                pickerCard.innerHTML = '';
                init();
            });
        }

        function renderStars(rating) {
            if (!rating) return '';
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;
            return '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty) +
                '<span class="stars-count">' + rating + '</span>';
        }

        async function loadTech() {
            tech = await api('/api/technicians/' + encodeURIComponent(techId));
            document.getElementById('techAvatar').textContent = tech.avatar || tech.name.slice(0, 2).toUpperCase();
            document.getElementById('techName').textContent = tech.name;
            document.getElementById('techSpecialty').textContent = tech.specialty;
            document.getElementById('techLocation').textContent = tech.location;
            document.getElementById('techRating').innerHTML = renderStars(tech.rating);
            updateAvailUI();
        }

        function updateAvailUI() {
            const badge = document.getElementById('techAvailBadge');
            const btn = document.getElementById('toggleAvailBtn');
            if (tech.available) {
                badge.textContent = 'Disponible';
                badge.className = 'badge-avail on';
                btn.innerHTML = '<i class="fa-solid fa-circle-pause"></i> Me rendre indisponible';
            } else {
                badge.textContent = 'Indisponible';
                badge.className = 'badge-avail off';
                btn.innerHTML = '<i class="fa-solid fa-circle-play"></i> Me rendre disponible';
            }
        }

        document.getElementById('toggleAvailBtn').addEventListener('click', async () => {
            const btn = document.getElementById('toggleAvailBtn');
            btn.disabled = true;
            try {
                tech = await api('/api/technicians/' + encodeURIComponent(techId), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ available: !tech.available })
                });
                updateAvailUI();
                showToast(tech.available ? 'Vous êtes maintenant disponible.' : 'Vous êtes marqué indisponible.', 'success');
            } catch (err) {
                showToast(err.message, 'error');
            }
            btn.disabled = false;
        });

        async function loadMissions() {
            const list = document.getElementById('missionList');
            let missions = [];
            try {
                missions = await api('/api/missions?technicianId=' + encodeURIComponent(techId));
            } catch {}

            if (!missions.length) {
                list.innerHTML = '<div class="empty-msg">Aucune mission ne vous est assignée pour le moment.</div>';
                return;
            }

            list.innerHTML = missions.map(m => {
                const label = statusLabels[m.status] || m.status;
                const isActive = ACTIVE.includes(m.status);
                const price = m.price ? m.price.toLocaleString() + ' FCFA' : 'Non fixé';
                return `
                    <div class="mission-card">
                        <div class="mission-main">
                            <div class="mission-top">
                                <span class="mission-client">${m.clientName || 'Client'}</span>
                                <span class="badge-statut ${m.status}">${label}</span>
                            </div>
                            <div class="mission-meta"><i class="fa-solid fa-mobile-screen"></i>${m.device || '—'} · <i class="fa-solid fa-file-invoice"></i>${price}</div>
                            <div class="mission-issue">${m.issue || ''}</div>
                        </div>
                        <div class="mission-actions">
                            ${isActive
                                ? `<a class="btn-chat" href="chat-negociation.html?tech=${encodeURIComponent(techId)}&demande=${encodeURIComponent(m.id)}"><i class="fa-solid fa-comments"></i> Ouvrir le chat</a>
                                   <a class="btn-ghost" href="suivi-mission.html?id=${encodeURIComponent(m.id)}"><i class="fa-solid fa-chart-line"></i> Suivi</a>`
                                : `<a class="btn-ghost" href="suivi-mission.html?id=${encodeURIComponent(m.id)}"><i class="fa-solid fa-chart-line"></i> Suivi</a>`}
                        </div>
                    </div>`;
            }).join('');
        }

        async function init() {
            if (!techId) {
                renderPicker();
                return;
            }
            document.getElementById('techPanel').style.display = 'block';
            document.getElementById('pickerCard').innerHTML = '';
            try {
                await loadTech();
            } catch (err) {
                showToast('Technicien introuvable.', 'error');
                document.getElementById('techPanel').style.display = 'none';
                renderPicker();
                return;
            }
            await loadMissions();
        }

        init();
    </script>

</body>
</html>
