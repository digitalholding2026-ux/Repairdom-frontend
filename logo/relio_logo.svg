<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Relio — logo corrigé</title>
  <desc id="desc">Le mot Reli en blanc, suivi d’un pin de localisation orange à la place du o. Fond transparent.</desc>
  <defs>
    <linearGradient id="relioPin" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FF9500"/>
      <stop offset="58%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#FF4D00"/>
    </linearGradient>
  </defs>

  <!-- Wordmark: the pin replaces the final “o”; the “i” remains a letter. -->
  <text x="54" y="266"
        fill="#F8FAFC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="258"
        font-weight="700"
        letter-spacing="-12">Reli</text>

  <!-- Location-pin “o” -->
  <path d="M854 42
           C777 42 724 98 724 169
           C724 246 854 334 854 334
           C854 334 984 246 984 169
           C984 98 931 42 854 42 Z"
        fill="url(#relioPin)"/>
  <circle cx="854" cy="164" r="57" fill="#0B0D12"/>
  <circle cx="854" cy="164" r="20" fill="#FF8A00"/>
</svg>
