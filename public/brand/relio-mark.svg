<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Relio">
  <defs>
    <linearGradient id="relio-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00AEEF"/>
      <stop offset="0.55" stop-color="#5B4DFF"/>
      <stop offset="1" stop-color="#8A2BE2"/>
    </linearGradient>
    <linearGradient id="relio-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00AEEF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#00AEEF" stop-opacity=".65"/>
    </linearGradient>
  </defs>
  <!-- Anneau orbital : le mouvement du service, traction vers l'avant. -->
  <path d="M8 42 A25 25 0 0 0 44 57"
        fill="none" stroke="url(#relio-orbit)" stroke-width="3.5"
        stroke-linecap="round"/>
  <!-- Monogramme « R » sculpté : fût, panse généreuse, jambe dynamique. -->
  <path d="M22 52 V14 H38 a9 9 0 0 1 0 18 H22 M31 32 L46 52"
        fill="none" stroke="url(#relio-g)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Reflet : filet de lumière au cœur du tracé. -->
  <path d="M22 52 V14 H38 a9 9 0 0 1 0 18 H22"
        fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tête-personne : pastille gradient ponctuée d'un éclat. -->
  <circle cx="42" cy="11" r="6" fill="url(#relio-g)"/>
  <circle cx="40" cy="9" r="1.6" fill="#FFFFFF" fill-opacity=".85"/>
</svg>
