<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 643 250" role="img" aria-label="Relio">
  <title>Relio — logo</title>
  <defs>
    <linearGradient id="relio-pin-light" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="58%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Wordmark « Relio » : le pin orange remplace le « o » final.
       `textLength` fixe la largeur avancée du texte pour que le pin se place
       toujours juste après, quelle que soit la police rendue. -->
  <text x="40" y="212" fill="#0B0D12" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="700" letter-spacing="-8" textLength="400" lengthAdjust="spacingAndGlyphs">Reli</text>
  <!-- Pin = « o » : échelle uniforme 0.565, posé sur la ligne de base (212). -->
  <g transform="translate(46.9 23.3) scale(0.565)">
    <path d="M854 42C777 42 724 98 724 169C724 246 854 334 854 334C854 334 984 246 984 169C984 98 931 42 854 42Z M797 164a57 57 0 1 0 114 0a57 57 0 1 0-114 0Z" fill="url(#relio-pin-light)" fill-rule="evenodd"/>
    <circle cx="854" cy="164" r="20" fill="#FB923C"/>
  </g>
</svg>